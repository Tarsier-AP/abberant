<!DOCTYPE html>
<html lang="ru">
  <head>
    <meta charset="UTF-8">
    <link rel="icon" href="/favicon.ico">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Abberant — игровые новости, обзоры и прохождения. Свежие публикации по любимым играм и платформам.">
    <!-- Card placeholder is the LCP image on most pages; load it eagerly. -->
    <link rel="preload" as="image" href="/img/news-placeholder.svg">
    <title>Abberant — игровые новости</title>
    <script>
      ;(function () {
        try {
          var stored = localStorage.getItem('abberant-theme')
          var theme =
            stored === 'light' || stored === 'dark'
              ? stored
              : window.matchMedia('(prefers-color-scheme: dark)').matches
                ? 'dark'
                : 'light'
          document.documentElement.dataset.theme = theme
        } catch (error) {
          // Use the CSS system-preference fallback.
        }
      })()
    </script>
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
