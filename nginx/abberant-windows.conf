# Abberant: static frontend + reverse proxy to the Go/Fiber backend.
# Windows variant: nginx/Windows runs from its install directory and uses
# relative paths, a single worker process and logs/nginx.pid.
#
# Install: unzip nginx into C:\nginx, copy this file to C:\nginx\conf\abberant.conf
# and reference it from C:\nginx\conf\nginx.conf:
#     http {
#         include       mime.types;
#         include       conf/abberant.conf;
#     }
# or run with an explicit config: C:\nginx\nginx.exe -c conf/abberant.conf
#
# Adjust root (the vite build output) and server_name as needed.

worker_processes  1;

error_log  logs/error.log;
pid        logs/nginx.pid;

events {
    worker_connections  1024;
}

http {
    include       mime.types;
    default_type  application/octet-stream;
    charset       utf-8;

    access_log  logs/access.log;

    sendfile           on;
    keepalive_timeout  65;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;

    server {
        listen       80;
        server_name  localhost;

        # Frontend statics (vite build output, e.g. copied to C:\abberant\dist)
        root  C:/abberant/dist;
        index index.html;

        # Backend API (Go/Fiber server)
        location /api/ {
            proxy_pass         http://127.0.0.1:8090;
            proxy_http_version 1.1;
            proxy_set_header   Host $host;
            proxy_set_header   X-Real-IP $remote_addr;
            proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header   X-Forwarded-Proto $scheme;

            # Avatars are posted as data URLs — keep a generous body limit.
            client_max_body_size 8m;
        }

        location / {
            try_files $uri $uri/ /index.html;
        }
    }
}
