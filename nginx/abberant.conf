# Abberant: static frontend + reverse proxy to the Go/Fiber backend.
# Copy to /etc/nginx/sites-available/abberant and symlink into sites-enabled,
# or include from the main nginx.conf. Adjust server_name and paths.

server {
    listen 80;
    server_name localhost;

    # Frontend statics (vite build output)
    root /var/www/abberant/dist;
    index index.html;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;

    # Backend API
    location /api/ {
        proxy_pass http://127.0.0.1:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Avatars are posted as data URLs — keep a generous body limit.
        client_max_body_size 8m;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
